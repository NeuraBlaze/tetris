<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#00a783">
    <title>Klasszikus Tetris</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="Klasszikus Tetris játék">
      <section class="game-shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">Játékok</p>
            <h1>Tetris</h1>
          </div>
          <button class="icon-button" id="pauseButton" type="button" aria-label="Szünet">II</button>
        </header>

        <section class="status-row" aria-label="Játék állása">
          <div class="stat">
            <span>Pont</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>Rekord</span>
            <strong id="bestScore">0</strong>
          </div>
          <div class="stat">
            <span>Szint</span>
            <strong id="level">1</strong>
          </div>
          <div class="stat">
            <span>Sor</span>
            <strong id="lines">0</strong>
          </div>
        </section>

        <section class="play-area">
          <div class="board-wrap">
            <canvas id="board" width="300" height="600" aria-label="Tetris pálya"></canvas>
            <div class="overlay hidden" id="overlay">
              <h2 id="overlayTitle">Tetris</h2>
              <p id="overlayText">Nyomj indítást.</p>
              <button id="startButton" type="button">Indítás</button>
            </div>
          </div>

          <aside class="side-panel" aria-label="Következő elem és vezérlés">
            <div class="next-box">
              <span>Következő</span>
              <canvas id="next" width="96" height="96" aria-label="Következő tetris elem"></canvas>
            </div>
            <button class="primary-button" id="restartButton" type="button">Új játék</button>
          </aside>
        </section>

        <section class="controls" aria-label="Mobil vezérlés">
          <button class="control-button" id="leftButton" type="button" aria-label="Balra">←</button>
          <button class="control-button" id="rotateButton" type="button" aria-label="Forgatás">↻</button>
          <button class="control-button" id="rightButton" type="button" aria-label="Jobbra">→</button>
          <button class="control-button accent" id="dropButton" type="button" aria-label="Leejtés">↓</button>
        </section>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
